<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Трекер: Разбор экзамена</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h2>📚 AI Study Planner</h2>
            <span id="status-badge" class="badge loading">Загрузка ИИ...</span>
        </header>

        <section class="control-panel">
            <div class="input-group">
                <label>1. Загрузите демо-билет (PDF)</label>
                <input type="file" id="pdf-upload" accept="application/pdf" disabled>
            </div>
            <div class="input-group">
                <label>2. Время на подготовку (часов)</label>
                <input type="number" id="total-hours" value="12" min="1" max="100" disabled>
            </div>
            <button id="generate-btn" disabled>Сгенерировать план</button>
        </section>

        <div id="progress-container">
            <p id="progress-text">Инициализация WebGPU (~2 ГБ)...</p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
        </div>

        <main id="cards-grid" class="hidden"></main>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
